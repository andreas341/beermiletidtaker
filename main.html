<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Løpstidtaker</title><link rel="stylesheet" href="styles.css"></head><body><header><div><small>GMT-BASERT TIDTAKING</small><h1>Løpstidtaker</h1></div><b id="gmtClock"></b></header><main><section class="card controls"><div><label>Løpstid</label><div id="raceClock">00:00:00.000</div><p id="statusText">Klar til start</p></div><div class="buttons"><button id="startButton">Start løpet</button><button id="stopButton" class="orange" disabled>Stopp tidtaking</button><button id="resetButton" class="light">Nullstill</button></div></section><section class="card"><div class="heading"><div><small>MÅLGANG</small><h2>Deltakere</h2></div><div class="buttons"><input id="searchInput" placeholder="Søk navn eller startnummer"><button id="reloadButton" class="light">Last på nytt</button></div></div><p id="participantMessage" class="warning" hidden></p><div id="participantGrid" class="grid"></div></section><section class="card"><div class="heading"><div><small>RESULTATER</small><h2>Resultatliste</h2></div><button id="exportButton" class="light">Last ned CSV</button></div><div class="table"><table><thead><tr><th>Plass</th><th>Startnr.</th><th>Navn</th><th>Tid</th><th></th></tr></thead><tbody id="resultsBody"></tbody></table><p id="emptyResults">Ingen deltakere er registrert i mål.</p></div></section></main><footer>Pausetiden teller ikke med. Data lagres lokalt i nettleseren.</footer><script src="app.js"></script></body></html>
