<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer Mile – live tidtaking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Beer Mile</h1>
      <span id="indicator" class="pill idle">Ikke startet</span>
    </header>

    <section class="board" aria-live="polite">
      <div id="clock" class="clock">00:00:00.000</div>
      <p id="status" class="status">Venter på start</p>
    </section>

    <div id="notice" class="notice hidden" role="alert"></div>

    <section class="card">
      <h2>Resultater</h2>
      <table>
        <thead><tr><th>Plass</th><th>Nr</th><th>Navn</th><th class="r">Tid</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
      <p id="empty" class="muted">Ingen i mål ennå.</p>
    </section>

    <footer class="foot"><span id="conn">Kobler til …</span></footer>
  </main>
  <script type="module" src="live.js"></script>
</body>
</html>
